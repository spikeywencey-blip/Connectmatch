<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List App</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --accent: #10b981;
        --danger: #ef4444;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --shadow: 0 16px 40px rgba(79, 70, 229, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #f4f7fb 100%);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }

      .app {
        width: min(100%, 520px);
        background: var(--panel);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 24px 18px 18px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 4vw, 2.2rem);
      }

      .task-count {
        min-width: 48px;
        height: 48px;
        border-radius: 14px;
        background: rgba(79, 70, 229, 0.1);
        color: var(--primary-dark);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 0.95rem;
      }

      .todo-form {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }

      .todo-form input {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 1rem;
        background: #fbfcff;
        color: var(--text);
      }

      .todo-form input:focus {
        outline: 2px solid rgba(79, 70, 229, 0.2);
        border-color: var(--primary);
      }

      .add-btn,
      .clear-btn,
      .filter-btn,
      .delete-btn {
        border: none;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .add-btn:hover,
      .clear-btn:hover,
      .filter-btn:hover,
      .delete-btn:hover {
        transform: translateY(-1px);
      }

      .add-btn {
        background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
        color: white;
        font-weight: 700;
        border-radius: 14px;
        padding: 14px 18px;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .filter-btn {
        background: #eef2ff;
        color: var(--primary-dark);
        border-radius: 999px;
        padding: 8px 12px;
        font-weight: 700;
      }

      .filter-btn.active {
        background: var(--primary);
        color: white;
      }

      .clear-btn {
        background: transparent;
        color: var(--muted);
        font-weight: 700;
      }

      .todo-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }

      .todo-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 10px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #fff;
      }

      .todo-item.completed .todo-text {
        text-decoration: line-through;
        color: var(--muted);
      }

      .check {
        width: 20px;
        height: 20px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .todo-text {
        flex: 1;
        font-size: 1rem;
        word-break: break-word;
      }

      .delete-btn {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
        border-radius: 10px;
        padding: 8px 10px;
        font-weight: 700;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 22px 12px;
        border: 1px dashed var(--border);
        border-radius: 14px;
        background: #fafbff;
      }

      @media (max-width: 420px) {
        .app {
          padding: 18px 14px 14px;
        }

        .header {
          align-items: flex-start;
        }

        .toolbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .todo-form {
          flex-direction: column;
        }

        .add-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="header">
        <h1>To-Do List</h1>
        <div class="task-count" id="taskCount">0</div>
      </div>

      <form id="todoForm" class="todo-form">
        <input
          id="todoInput"
          type="text"
          placeholder="Add a new task..."
          aria-label="Add a new task"
          maxlength="120"
          required
        />
        <button type="submit" class="add-btn">Add</button>
      </form>

      <div class="toolbar">
        <div class="filters" aria-label="Filter tasks">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="completed" type="button">Completed</button>
        </div>

        <button id="clearCompleted" class="clear-btn" type="button">Clear completed</button>
      </div>

      <ul id="todoList" class="todo-list" aria-live="polite"></ul>
    </main>

    <script>
      const STORAGE_KEY = 'todoApp.tasks';
      const todoForm = document.getElementById('todoForm');
      const todoInput = document.getElementById('todoInput');
      const todoList = document.getElementById('todoList');
      const taskCount = document.getElementById('taskCount');
      const filterButtons = document.querySelectorAll('.filter-btn');
      const clearCompletedBtn = document.getElementById('clearCompleted');

      let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      let currentFilter = 'all';

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function getFilteredTasks() {
        if (currentFilter === 'active') {
          return tasks.filter((task) => !task.completed);
        }
        if (currentFilter === 'completed') {
          return tasks.filter((task) => task.completed);
        }
        return tasks;
      }

      function updateTaskCount() {
        const remaining = tasks.filter((task) => !task.completed).length;
        taskCount.textContent = remaining;
      }

      function renderTasks() {
        const filteredTasks = getFilteredTasks();
        todoList.innerHTML = '';

        if (filteredTasks.length === 0) {
          const emptyState = document.createElement('li');
          emptyState.className = 'empty';
          emptyState.textContent = 'No tasks here yet.';
          todoList.appendChild(emptyState);
          updateTaskCount();
          return;
        }

        filteredTasks.forEach((task) => {
          const item = document.createElement('li');
          item.className = `todo-item ${task.completed ? 'completed' : ''}`;

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = task.completed;
          checkbox.className = 'check';
          checkbox.setAttribute('aria-label', `Mark ${task.text} as complete`);

          const text = document.createElement('span');
          text.className = 'todo-text';
          text.textContent = task.text;

          const deleteBtn = document.createElement('button');
          deleteBtn.type = 'button';
          deleteBtn.className = 'delete-btn';
          deleteBtn.textContent = 'Delete';
          deleteBtn.setAttribute('aria-label', `Delete task ${task.text}`);

          checkbox.addEventListener('change', () => {
            task.completed = checkbox.checked;
            saveTasks();
            renderTasks();
          });

          deleteBtn.addEventListener('click', () => {
            tasks = tasks.filter((t) => t.id !== task.id);
            saveTasks();
            renderTasks();
          });

          item.appendChild(checkbox);
          item.appendChild(text);
          item.appendChild(deleteBtn);
          todoList.appendChild(item);
        });

        updateTaskCount();
      }

      todoForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const value = todoInput.value.trim();

        if (!value) {
          todoInput.focus();
          return;
        }

        tasks.unshift({
          id: Date.now(),
          text: value,
          completed: false,
        });

        todoInput.value = '';
        saveTasks();
        renderTasks();
      });

      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          currentFilter = button.dataset.filter;

          filterButtons.forEach((btn) => {
            btn.classList.toggle('active', btn === button);
          });

          renderTasks();
        });
      });

      clearCompletedBtn.addEventListener('click', () => {
        tasks = tasks.filter((task) => !task.completed);
        saveTasks();
        renderTasks();
      });

      renderTasks();
    </script>
  </body>
</html>
